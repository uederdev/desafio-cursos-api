services:
  postgres:
    image: postgres:14-alpine
    container_name: cursos-postgres
    environment:
      POSTGRES_DB: db_cursos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - cursos-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cursos-api
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_cursos
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 1234
    ports:
      - "8081:8080"
    networks:
      - cursos-network

volumes:
  db_data:

networks:
  cursos-network:
    driver: bridge